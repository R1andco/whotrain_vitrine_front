<!--
  WHOTRAIN — Page de résultats personnels
  ----------------------------------------
  À coller dans un bloc « Code intégré / HTML personnalisé » sur une page
  du site Hostinger Builder (ex. la page /mon-resultat).

  Chaque répondant ouvre son lien personnel :  .../mon-resultat?id=JETON
  La page lit le jeton, retrouve ses réponses et réaffiche le même écran
  de résultat que la fin du quiz. Aucun email n'est stocké dans ce code.

  Pour mettre à jour les données : remplacer l'objet WT_DATA plus bas.
-->

    <p class="wt-signature" data-signature=""></p>

      subs: [["L'Ingénieur pédagogique", "Conçoit des parcours précis et méthodiques."], ["Le Stratège", "Utilise simulations et cas réels pour développer les compétences."]],
    },
    facilitateur: {
      name: "Le Facilitateur",
      signature: "Le savoir est déjà dans le groupe.",
      description: "Vous créez les conditions de l'échange. Vous faites circuler les idées, vous donnez de la place aux expériences et vous stimulez l'intelligence collective.",
      strengths: ["Intelligence collective", "Engagement des participants", "Partage d'expériences", "Climat propice à la participation"],
      watchouts: ["Maintenir un fil conducteur clair", "Apporter des repères nouveaux lorsque le groupe en a besoin"],
      subs: [["Le Connecteur", "Fait circuler les idées et les expériences du groupe."], ["Le Médiateur", "Favorise l'expression et la participation de chacun."]],
    },
    catalyseur: {
      name: "Le Catalyseur",
      signature: "Je crée les conditions pour que l'apprentissage se produise.",
      description: "Vous provoquez des déclics. Vous aimez l'expérimentation, les prises de conscience et les apprentissages qui transforment durablement la pratique.",
      strengths: ["Déclics puissants", "Forte implication des participants", "Transformation durable", "Apprentissage par l'action"],
      watchouts: ["Sécuriser les participants qui préfèrent un cadre très explicite", "Rendre l'évaluation des acquis visible en fin de séquence"],
      subs: [["L'Explorateur", "Fait apprendre par l'expérimentation et la découverte."], ["Le Révélateur", "Provoque les prises de conscience et les changements durables."]],
    },
  };

  const $ = (selector) => root.querySelector(selector);
  const screens = root.querySelectorAll(".wt-screen");

  function show(name) {
    screens.forEach((screen) => screen.classList.toggle("is-active", screen.dataset.screen === name));
  }

  function highSide(values) {
    if (!values.length) return 50;
    return Math.round(values.reduce((sum, value) => sum + value - 1, 0) / (values.length * 4) * 100);
  }

  function axisScores(answers) {
    const approach = questions.map((q, i) => q[0] === "approach" ? answers[i] : null).filter(Boolean);
    const posture = questions.map((q, i) => q[0] === "posture" ? answers[i] : null).filter(Boolean);
    const experience = highSide(approach);
    const facilitator = highSide(posture);
    return { transmission: 100 - experience, experience, expert: 100 - facilitator, facilitator };
  }

  function calculateResult(answers) {
    const scores = axisScores(answers);
    const ranked = [
      ["maitre", "Le Maître", Math.round((scores.transmission + scores.expert) / 2), scores.transmission * scores.expert],
      ["architecte", "L'Architecte", Math.round((scores.experience + scores.expert) / 2), scores.experience * scores.expert],
      ["facilitateur", "Le Facilitateur", Math.round((scores.transmission + scores.facilitator) / 2), scores.transmission * scores.facilitator],
      ["catalyseur", "Le Catalyseur", Math.round((scores.experience + scores.facilitator) / 2), scores.experience * scores.facilitator],
    ].sort((a, b) => b[3] - a[3] || b[2] - a[2]);
    const key = ranked[0][0];
    const subIndex = {
      maitre: scores.transmission >= scores.expert,
      architecte: scores.expert >= scores.experience,
      facilitateur: scores.transmission >= scores.facilitator,
      catalyseur: scores.experience >= scores.facilitator,
    }[key] ? 0 : 1;
    const profile = profiles[key];
    const sub = profile.subs[subIndex];
    const approach = scores.experience >= scores.transmission ? `Expérience ${scores.experience} %` : `Transmission ${scores.transmission} %`;
    const posture = scores.facilitator >= scores.expert ? `Facilitateur ${scores.facilitator} %` : `Expert ${scores.expert} %`;
    return {
      scores, ranked, profile, sub,
      share: `Je viens de faire le quiz Whotrain : mon profil de formateur est ${profile.name}, avec une nuance ${sub[0]}. Mon style : ${approach} et ${posture}.`,
    };
  }

  function bar(label, value) {
    return `<div class="wt-bar"><span>${label}</span><span class="wt-bar-track" aria-hidden="true"><i style="width:${value}%"></i></span><strong>${value} %</strong></div>`;
  }

  function renderResult(result) {
    const secondary = result.ranked[1];
    $("[data-result-profile]").textContent = `${result.profile.name} (${result.ranked[0][2]} %)`;
    $("[data-signature]").textContent = result.profile.signature;
    $("[data-subprofile]").textContent = `Votre nuance : ${result.sub[0]}`;
    $("[data-secondary]").innerHTML = `Profil secondaire : <b>${secondary[1]}</b> (${secondary[2]} %)`;
    $("[data-description]").textContent = `${result.profile.description} ${result.sub[1]}`;
    $("[data-profile-bars]").innerHTML = result.ranked.map((item) => bar(item[1], item[2])).join("");
    $("[data-axis-bars]").innerHTML = [
      bar("Transmission", result.scores.transmission),
      bar("Expérience", result.scores.experience),
      bar("Expert", result.scores.expert),
      bar("Facilitateur", result.scores.facilitator),
    ].join("");
    $("[data-strengths]").innerHTML = result.profile.strengths.map((item) => `<li>${item}</li>`).join("");
    $("[data-watchouts]").innerHTML = result.profile.watchouts.map((item) => `<li>${item}</li>`).join("");
    $("[data-share]").textContent = result.share;
  }

  function showMessage(title, text) {
    $("[data-message-title]").textContent = title;
    $("[data-message-text]").textContent = text;
    show("message");
  }

  function toast(message) {
    const target = $("[data-toast]");
    target.textContent = message;
    target.classList.add("is-visible");
    window.clearTimeout(toast.timer);
    toast.timer = window.setTimeout(() => target.classList.remove("is-visible"), 2200);
  }

  let currentResult = null;

  root.addEventListener("click", (event) => {
    const target = event.target.closest("button");
    if (!target || !root.contains(target)) return;
    if (target.matches("[data-share-linkedin]") && currentResult) {
      const text = `${currentResult.share}\n\n${SHARE_URL}`;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => {});
      }
      const composer = `https://www.linkedin.com/feed/?shareActive=true&text=${encodeURIComponent(text)}`;
      window.open(composer, "_blank", "noopener");
      toast("Texte copié. Collez-le dans la publication si LinkedIn ne le pré-remplit pas.");
    }
  });

  // ====== Chargement du résultat à partir du lien personnel ======
  // Lit le jeton depuis plusieurs sources, pour fonctionner aussi bien
  // si le code tourne directement dans la page que s'il est dans un iframe.
  function tokenFrom(str) {
    if (!str) return "";
    try {
      let q = str;
      if (q.indexOf("?") !== -1) q = q.split("?").slice(1).join("?");
      q = q.replace(/^#/, "");
      const p = new URLSearchParams(q);
      return (p.get("id") || p.get("r") || "").trim().toLowerCase();
    } catch (e) { return ""; }
  }
  function getToken() {
    // 1. URL de ce contexte (search puis hash : ...?id=xxx ou ...#id=xxx)
    let t = tokenFrom(window.location.search) || tokenFrom(window.location.hash);
    if (t) return t;
    // 2. fenêtre parente / supérieure (même origine)
    try { if (window.top && window.top !== window) { t = tokenFrom(window.top.location.search) || tokenFrom(window.top.location.hash); if (t) return t; } } catch (e) {}
    try { if (window.parent && window.parent !== window) { t = tokenFrom(window.parent.location.search) || tokenFrom(window.parent.location.hash); if (t) return t; } } catch (e) {}
    // 3. page référente (fonctionne même en cross-origin : URL de la page hôte)
    return tokenFrom(document.referrer);
  }

  const token = getToken();
  if (!token) {
    showMessage("Lien incomplet", "Ce lien ne contient pas d'identifiant. Utilisez le lien personnel reçu par email pour retrouver votre résultat.");
    return;
  }
  const answers = WT_DATA[token];
  if (!answers || answers.length !== 16) {
    showMessage("Résultat introuvable", "Nous n'avons pas trouvé de résultat correspondant à ce lien. Vérifiez que vous avez copié le lien complet reçu par email.");
    return;
  }
  currentResult = calculateResult(answers);
  renderResult(currentResult);
  show("result");
})();
</script>
